<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Kit parent harness</title></head>
<body>
<ul id="log"></ul>
<iframe src="kit-demo.html" style="width:100%;height:900px;border:1px solid #ccc"></iframe>
<script>
window.addEventListener("message", (e) => {
  if (!e.data || e.data.source !== "teach-quiz") return;
  const li = document.createElement("li"); li.textContent = JSON.stringify(e.data);
  document.getElementById("log").appendChild(li);
  console.log("MSG " + JSON.stringify(e.data));
});
</script>
</body>
</html>
